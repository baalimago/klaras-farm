name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install
        run: |
          uv sync --locked
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Python lint and format (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Python types (ty, beta, advisory)
        run: uv run ty check
        continue-on-error: true
      - name: requirements.txt matches uv.lock (Wasmer installs from it)
        run: uv export --no-dev --no-hashes --no-header --frozen -o /tmp/req.txt && diff -u requirements.txt /tmp/req.txt
      - name: Unit tests with coverage (Node, fails under 70%)
        run: npm test
      - name: Backend unit and e2e tests with coverage (fails under 70%)
        run: uv run pytest -q
      - name: Browser tests (Chromium against the real Python app)
        run: uv run npm run test:browser
