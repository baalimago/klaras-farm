name: CI
# Deploys are gated on tests: work is pushed to `develop`; when every check below passes,
# the `promote` job fast-forwards `main` to that commit, and Wasmer deploys `main`.
# Never push to `main` by hand (AGENTS.md, "Running and deploying").
on:
  push:
    branches: [develop, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    # Pinned: Playwright's Chromium needs a supported Ubuntu (ubuntu-latest moved past it).
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Install
        run: |
          uv sync --locked
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
      - name: Python lint and format (ruff)
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: Python types (ty, beta, advisory)
        run: uv run ty check
        continue-on-error: true
      - name: requirements.txt matches uv.lock (Wasmer installs from it)
        run: uv export --no-dev --no-hashes --no-header --frozen -o /tmp/req.txt && diff -u requirements.txt /tmp/req.txt
      - name: Unit tests with coverage (Node, fails under 70%)
        run: npm test
      - name: Backend unit and e2e tests with coverage (fails under 70%)
        run: uv run pytest -q
      - name: Browser tests (Playwright, Chromium against the real Python app)
        run: uv run npm run test:browser

  promote:
    # Only a fully green develop reaches main (and so the live app). A manual run on develop
    # promotes too, for when a push did not start CI.
    needs: test
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Fast-forward main to the tested commit
        run: |
          git fetch origin main
          if git merge-base --is-ancestor origin/main "$GITHUB_SHA"; then
            git push origin "$GITHUB_SHA:refs/heads/main"
          else
            echo "::error::main has commits that are not on develop; merge main into develop first."
            exit 1
          fi
